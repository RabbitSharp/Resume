# German CV content.
#
# This file contains *what* the CV says. How it looks and on which page a
# section ends up is defined in style/style.yaml.
#
# "@{key}" references a translatable label from content/labels.yaml.
# Section ids must match the ids used in style.yaml -> layout.pages.

meta:
  language: de

header:
  name: Gimli
  tagline: >-
    Leidenschaftlicher Möhrenvernichter und Fan von weichen Teppichen
    mit Hang zur Selbstdarstellung

sections:

  # ---------------------------------------------------------------- page 1
  contact:
    type: contact
    title: "@{contact}"
    groups:
      - items:
          - { type: birthdate, value: "06.11.2018" }
          - { type: email,     value: "gimli@icarrot.com" }
          - { type: phone,     value: "+49 123 4567890" }
          - { type: location,  value: "Warren 21, 12345 Bunnheaven" }
      - items:
          # - { type: homepage, label: resume.carroteers.de, url: "https://carroteers.de" }
          - { type: github,   label: "@RabbitSharp", url: "https://github.com/RabbitSharp" }
          - { type: linkedin, label: "Gimli", url: "https://www.linkedin.com/in/gimli-a123b456/" }
          - { type: xing,     label: "Gimli", url: "https://www.xing.com/profile/gimli" }

  skills-highlight:
    type: rated-skills
    title: "@{skills_highlight}"
    groups:
      - name: Futtern
        skills:
          - { name: Knusperkissen,    level: 5 }
          - { name: Kohlrabiblätter,  level: 5 }
          - { name: Möhren,           level: 4 }
          - { name: Erbsenflocken,    level: 4 }
      - name: Enspannen
        skills:
          - { name: Wälzen, level: 5 }
          - { name: Dösen,  level: 5 }
          - { name: Yoga,   level: 4 }

  languages:
    type: rated-skills
    title: "@{languages}"
    groups:
      - skills:
          - { name: Multilingual, level: 5 }

  certificates:
    type: simple-skills
    title: "@{certificates}"
    items:
      - Certified Professional Feel-Good Management

  work:
    type: jobs
    title: "@{work}"
    icon: faGears
    entries:
      - period: "03/2019 - @{today}"
        place: "Carroteers, Hamburg"
        position: Feel-Good Manager
      - period: "02/2019 - @{today}"
        place: "Carroteers, Hamburg"
        position: Grünzeugvernichter
        note: aller Art

  work-wheel:
    type: wheelchart
    outer: 1.5cm
    inner: 0.5cm
    slices:
      - { value: 2, width: 8em, shade: 40, label: Feel-Good Manager }
      - { value: 2, width: 8em, shade: 80, label: Grünzeugvernichter }

  university:
    type: jobs
    title: "@{university}"
    icon: faMortarBoard
    entries:
      - period: "01/2019 - 02/2019"
        place: Bauernhof Hetlingen
        position: Gute Laune Diplom
        note: Studiengang Glück

  education:
    type: jobs
    title: "@{education}"
    icon: faBook
    entries:
      - period: "11/2018 - 12/2018"
        place: Bauernhof Hetlingen
        position: Kleine Reife

  # ---------------------------------------------------------------- page 2
  # Tags are rendered in the order given; break long lists by hand into a
  # pleasant looking layout.
  skills-tags:
    type: tag-groups
    title: "@{skills}"
    groups:
      - name: Futtern
        tags: [Knusperkissen, Dill, Kohlrabiblätter, Möhren, Erbsenflocken, Petersilie, Sellerie]
      - name: Entspannen
        tags: [Wälzen, Dösen, Yoga, Schlafen, Meditieren]
      - name: Dienstleistungen
        tags: [Performance Kunst, Nasenschlecker, Betthupferle, Pep Talk]

  projects-main:
    type: projects
    title: "@{projects}"
    entries:
      - title: How To Train Your Human
        client: Carroteers
        period: "03/2019 -- @{today}"
        industry: Dienstleistung
        role: Trainer
        team: "5 -- 6"
        link: { label: carroteers.de, url: "https://carroteers.de" }
        environment: diverse Suggestions Techniken
        summary: Konzeption einer Anleitung zum Training für Zweibeiner

      - title: Mission Winterspeck
        client: Carroteers
        period: "10/2019 -- 03/2020"
        industry: Dienstleistung
        role: Macher
        team: "1"
        environment: Karotten, Knusperkissen, Banane
        summary: Erreichung eines Gewichtszieles

  # ---------------------------------------------------------------- page 3
  roles-wheel:
    type: wheelchart
    title: "@{roles_and_industries}"
    subtitle: "@{roles}"
    outer: 1.2cm
    inner: 0.5cm
    slices:
      - { value: 5,  width: 2.6em, shade: 100, label: Trainer }
      - { value: 4,  width: 2.6em, shade: 60,  label: Macher }
      - { value: 3,  width: 4.5em, shade: 40,  label: Yogalehrer }
      - { value: 12, width: 3em,   shade: 80,  label: Feel-Good Manager }

  industries-wheel:
    type: wheelchart
    subtitle: "@{industries}"
    outer: 1.2cm
    inner: 0.5cm
    slices:
      - { value: 4,  width: 5em, shade: 40, label: Dienstleistung }
      - { value: 20, width: 4em, shade: 80, label: Futterindustrie }

  projects-secondary:
    type: projects
    entries:
      - title: Operation Flausch
        client: Carroteers
        period: "09/2019 -- @{today}"
        industry: Dienstleistung
        role: Macher
        team: "1"
        environment: Fellpflege, Erbsenflocken, Knusperkissen, Teppiche
        summary: Optimierung des FPI (Flausch Performance Indikator)
